# Builds the documentation (docs/, an mdBook) and publishes it with GitHub Pages.
# In the repository settings, set Pages -> Source to "GitHub Actions".
name: docs

on:
  push:
    branches: [main]
    paths: ["docs/**", "book.toml", "src/stdlib/**", "src/stdref.rs", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook
      # the examples in the guide must compile, and the library reference must match the library
      - run: cargo test --test docs_examples --test stdref
      - run: mdbook build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
