# Builds and tests the compiler and the language server, and type-checks the VS Code extension.
# (The checks against a real Minecraft server, tools/verify_all.sh, need Java 25 and a jar download,
# so they are run by hand.)
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # the compiler crate must build from the files cargo publishes
      - run: cargo package -p slab-lang --locked
      # the code examples in the repository must stay formatted
      - run: cargo run -q -- fmt --check examples src/stdlib

  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci
      - run: npm run compile
      # the package must be accepted by the marketplace tooling (icon, manifest, ignore rules)
      - run: npm run package
