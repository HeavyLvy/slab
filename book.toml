[book]
title = "slab"
authors = ["HeavyLvy"]
description = "A statically typed language that compiles to Minecraft data packs"
language = "en"
src = "docs"

[build]
# `target/` is already ignored by git
build-dir = "target/book"

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/HeavyLvy/slab"
edit-url-template = "https://github.com/HeavyLvy/slab/edit/main/{path}"
additional-js = ["docs/theme/slab-highlight.js"]
