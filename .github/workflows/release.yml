# Publishes a release when a version tag (v1.2.3, v1.2.3-rc.1) is pushed: checks that the tag
# matches the versions in the repository, builds `slab` and `slab-lsp` for three platforms and the
# VS Code extension, and creates the GitHub release with the changelog section as its notes.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' || { echo "::error::$GITHUB_REF_NAME is not a version tag (vMAJOR.MINOR.PATCH)"; exit 1; }
          for f in Cargo.toml crates/slab-lsp/Cargo.toml; do
            grep -m1 '^version = ' "$f" | grep -q "\"$version\"" || { echo "::error::$f does not have version $version"; exit 1; }
          done
          grep -m1 '"version":' editors/vscode/package.json | grep -q "\"$version\"" || { echo "::error::editors/vscode/package.json does not have version $version"; exit 1; }
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no section for $version"; exit 1; }
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::the tag is not on main"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  binaries:
    needs: check
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, name: linux-x86_64, exe: "" }
          - { os: macos-latest, name: macos-arm64, exe: "" }
          - { os: windows-latest, name: windows-x86_64, exe: ".exe" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked --workspace
      - name: package
        shell: bash
        run: |
          dir="slab-${{ needs.check.outputs.version }}-${{ matrix.name }}"
          mkdir "$dir"
          cp "target/release/slab${{ matrix.exe }}" "target/release/slab-lsp${{ matrix.exe }}" LICENSE NOTICE README.md "$dir/"
          if [ "${{ matrix.exe }}" = ".exe" ]; then 7z a "$dir.zip" "$dir" >/dev/null; else tar czf "$dir.tar.gz" "$dir"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: slab-${{ matrix.name }}
          path: |
            slab-*.tar.gz
            slab-*.zip

  extension:
    needs: check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: vscode-extension
          path: editors/vscode/*.vsix

  release:
    needs: [check, binaries, extension]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ needs.check.outputs.version }}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          flag=""
          case "$version" in *-*) flag="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --title "slab $version" --notes-file notes.md $flag
