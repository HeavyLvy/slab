[workspace]
members = ["crates/slab-lsp"]

[package]
name = "slab-lang"
version = "0.1.0"
edition = "2024"
authors = ["HeavyLvy <90272914+HeavyLvy@users.noreply.github.com>"]
license = "Apache-2.0"
description = "A statically typed language that compiles to Minecraft Java data packs"
repository = "https://github.com/HeavyLvy/slab"
homepage = "https://heavylvy.github.io/slab/"
readme = "README.md"
keywords = ["minecraft", "datapack", "compiler", "language"]
categories = ["compilers", "game-development"]
rust-version = "1.88"

exclude = ["/editors", "/tools", "/.github", "/CLAUDE.md", "/book.toml"]

[lib]
name = "slab"

[[bin]]
name = "slab"
path = "src/main.rs"

# `cargo binstall` downloads the prebuilt binaries of the GitHub release instead of compiling
[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/slab-{ version }-linux-x86_64.tar.gz"
pkg-fmt = "tgz"
bin-dir = "slab-{ version }-linux-x86_64/{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/slab-{ version }-macos-arm64.tar.gz"
pkg-fmt = "tgz"
bin-dir = "slab-{ version }-macos-arm64/{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/slab-{ version }-windows-x86_64.zip"
pkg-fmt = "zip"
bin-dir = "slab-{ version }-windows-x86_64/{ bin }{ binary-ext }"

[dependencies]
