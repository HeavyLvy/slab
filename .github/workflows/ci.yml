# Builds and tests the compiler and the language server, and type-checks the VS Code extension.
# (The checks against a real Minecraft server, tools/verify_all.sh, need Java 25 and a jar download,
# so they are run by hand.)
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # the compiler crate must build from the files cargo publishes
      - run: cargo package -p slab-lang --locked
      # the code examples in the repository must stay formatted
      - run: cargo run -q -- fmt --check examples src/stdlib

  # the #[test] functions of an example project, on a real Minecraft server (the server jar is
  # downloaded from Mojang once and cached; running it means accepting the EULA)
  server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/cache@v4
        with:
          path: ~/.cache/slab
          key: minecraft-server-26.3
      - run: cargo run -q -- test examples/projects/tested --accept-eula

  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci
      - run: npm run compile
      # the .vsix must build (icon, manifest, ignore rules)
      - run: npm run package
